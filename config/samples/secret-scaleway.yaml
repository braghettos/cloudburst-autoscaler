# Scaleway API credentials secret
# Both SCW_SECRET_KEY and SCW_ACCESS_KEY are recommended for proper authentication
apiVersion: v1
kind: Secret
metadata:
  name: scaleway-credentials
  namespace: default
type: Opaque
stringData:
  SCW_SECRET_KEY: "your-scaleway-secret-key"     # Required
  SCW_ACCESS_KEY: "your-scaleway-access-key"     # Recommended
