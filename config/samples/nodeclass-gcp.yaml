# GCP NodeClass: defines how and where GCP VMs are provisioned
apiVersion: cloudburst.io/v1alpha1
kind: NodeClass
metadata:
  name: gcp-nodeclass
  namespace: default
spec:
  gcp:
    project: "your-gcp-project-id"       # Replace with your GCP project ID
    zone: "us-central1-a"                 # Replace with your preferred zone
  join:
    hostApiServer: "https://<HOST_TAILSCALE_IP>:6443"  # Replace with your Tailscale IP
    kindClusterName: "cloudburst"
    tokenTtlMinutes: 60
  tailscale:
    authKeySecretRef:
      name: tailscale-auth
      key: authkey
  bootstrap:
    kubernetesVersion: "1.34.3"
