apiVersion: v1
kind: Pod
metadata:
  name: high-resource-pod
  namespace: default
spec:
  containers:
  - name: test-container
    image: nginx:latest
    resources:
      requests:
        cpu: "3000m"
        memory: "10Gi"
      limits:
        cpu: "3000m"
        memory: "10Gi"
  # This pod will be Unschedulable because it requests more resources
  # than available on the kind cluster, triggering NodeClaim creation
