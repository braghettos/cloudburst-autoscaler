apiVersion: cloudburst.io/v1alpha1
kind: NodePool
metadata:
  name: example-nodepool
  namespace: default
spec:
  requirements:
    regionConstraint: "EU"
    arch:
    - "x86_64"
    maxPriceEurPerHour: 0.15
    allowedProviders:
    - "gcp"
  limits:
    maxNodes: 10
    minNodes: 0
  template:
    labels:
      cloudburst.io/nodepool: "example-nodepool"
    taints:
    - key: "cloudburst.io/node"
      value: "true"
      effect: "NoSchedule"
  disruption:
    ttlSecondsAfterEmpty: 300
    ttlSecondsUntilExpired: 3600
  weight: 1
