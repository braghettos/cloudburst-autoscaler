# High-resource pod that triggers GCP provisioning
# This pod requests more resources than available on the Kind cluster,
# forcing the controller to provision a GCP VM via CloudBroker
apiVersion: v1
kind: Pod
metadata:
  name: gcp-workload
  namespace: default
  labels:
    app: gcp-workload
spec:
  containers:
  - name: workload
    image: busybox:1.36
    command: ["sleep", "infinity"]
    resources:
      requests:
        cpu: "1500m"
        memory: "2Gi"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
          - key: cloudburst.io/provider
            operator: In
            values: ["gcp"]
