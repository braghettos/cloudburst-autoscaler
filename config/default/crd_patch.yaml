# This patch adds a label to all CRDs
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: cloudburst-autoscaler
    app.kubernetes.io/instance: cloudburst-autoscaler
    app.kubernetes.io/part-of: cloudburst-autoscaler
    app.kubernetes.io/managed-by: kustomize
