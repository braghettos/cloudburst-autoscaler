                  securityGroupIDs:
                    description: SecurityGroupIDs are the security group IDs to attach
                      to the instance (optional)
                    items:
                      type: string
                    type: array
                  subnetID:
                    description: SubnetID is the VPC subnet ID for the instance (optional;
                      uses default if empty)
                    type: string
                required:
                - ami
                type: object
              azure:
                description: Azure configuration (used when NodeClaim Chosen.Provider
                  is azure)
                properties:
                  clientIDSecretRef:
                    description: ClientIDSecretRef references a secret containing
                      the Azure client (application) ID.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        description: |-
                          Name of the referent.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  clientSecretSecretRef:
                    description: ClientSecretSecretRef references a secret containing
                      the Azure client secret.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        description: |-
                          Name of the referent.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
