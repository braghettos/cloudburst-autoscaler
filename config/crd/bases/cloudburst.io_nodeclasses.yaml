---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: nodeclasses.cloudburst.io
spec:
  group: cloudburst.io
  names:
    kind: NodeClass
    listKind: NodeClassList
    plural: nodeclasses
    singular: nodeclass
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeClass is the Schema for the nodeclasses API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeClassSpec defines the desired state of NodeClass
            properties:
              bootstrap:
                description: Bootstrap configuration
                properties:
                  kubernetesVersion:
                    description: KubernetesVersion is the Kubernetes version to use
                      (optional)
                    type: string
                type: object
              gcp:
                description: GCP configuration (used when NodeClaim Chosen.Provider
                  is gcp)
                properties:
                  imageFamily:
                    default: ubuntu-2204-lts
                    description: 'ImageFamily is the image family to use (default:
                      ubuntu-2204-lts)'
                    type: string
                  imageProject:
                    default: ubuntu-os-cloud
                    description: 'ImageProject is the image project (default: ubuntu-os-cloud)'
                    type: string
                  project:
                    description: Project is the GCP project ID
                    type: string
                  zone:
                    description: Zone is the GCP zone
                    type: string
                required:
                - project
                - zone
                type: object
              hetzner:
                description: Hetzner Cloud configuration (used when NodeClaim Chosen.Provider
                  is hetzner)
                properties:
                  apiTokenSecretRef:
                    description: |-
                      APITokenSecretRef references a secret containing the Hetzner Cloud API token.
                      Secret must have the key specified (default "HETZNER_API_TOKEN").
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        description: |-
                          Name of the referent.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  image:
                    description: 'Image is the Hetzner Cloud image name or ID (default:
                      "ubuntu-22.04")'
                    type: string
                  location:
                    description: Location is the Hetzner Cloud datacenter location
                      (e.g. "fsn1", "nbg1", "hel1")
                    type: string
                required:
                - location
                type: object
              join:
                description: Join configuration for joining the Kubernetes cluster
                properties:
                  hostApiServer:
                    description: HostApiServer is the API server endpoint (e.g. https://<HOST_TAILSCALE_IP>:6443)
                    type: string
                  kindClusterName:
                    default: cloudburst
                    description: |-
                      KindClusterName is the kind cluster name (default: cloudburst)
                      The control plane container name will be constructed as <KindClusterName>-control-plane
                    type: string
                  kindControlPlaneContainer:
                    description: |-
                      KindControlPlaneContainer is the kind control plane container name (optional, overrides KindClusterName)
                      If not set, will be constructed as <KindClusterName>-control-plane
                    type: string
                  tokenTtlMinutes:
                    default: 30
                    description: 'TokenTtlMinutes is the token TTL in minutes (default:
                      30)'
                    format: int32
                    type: integer
                required:
                - hostApiServer
                type: object
              scaleway:
                description: Scaleway configuration (used when NodeClaim Chosen.Provider
                  is scaleway)
                properties:
                  apiKeySecretRef:
                    description: |-
                      APIKeySecretRef references a secret containing the Scaleway API credentials.
                      Secret must have key "SCW_SECRET_KEY" or "secret-key" (required).
                      Secret may also have "SCW_ACCESS_KEY" or "access-key" (optional but recommended).
                      The controller will set both SCW_SECRET_KEY and SCW_ACCESS_KEY environment variables
                      from the secret if present. Alternatively set SCW_SECRET_KEY and SCW_ACCESS_KEY env vars.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        description: |-
                          Name of the referent.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  image:
                    description: |-
                      Image is the Scaleway image identifier (e.g. ubuntu_jammy, or image UUID).
                      Defaults to Ubuntu 22.04 if empty.
                    type: string
                  organizationID:
                    description: OrganizationID is the Scaleway organization ID (optional;
                      can use default from credentials)
                    type: string
                  projectID:
                    description: ProjectID is the Scaleway project ID (optional; can
                      use default from credentials)
                    type: string
                  zone:
                    description: Zone is the Scaleway zone (e.g. fr-par-1, nl-ams-1)
                    type: string
                required:
                - zone
                type: object
              tailscale:
                description: Tailscale configuration for VPN connectivity
                properties:
                  apiTokenSecretRef:
                    description: |-
                      APITokenSecretRef references a secret containing the Tailscale API token (tskey-api-...).
                      Required when EphemeralKeyFromAPI is true. The token must have devices:write (create keys).
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        description: |-
                          Name of the referent.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  authKeySecretRef:
                    description: |-
                      AuthKeySecretRef references a secret containing the Tailscale auth key (static key for all nodes).
                      Ignored if EphemeralKeyFromAPI is set.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        description: |-
                          Name of the referent.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  ephemeralKeyFromAPI:
                    description: |-
                      EphemeralKeyFromAPI when true, the controller creates a new ephemeral auth key per NodeClaim
                      via the Tailscale API instead of using a key from specs. Requires APITokenSecretRef.
                      Nodes are removed from the tailnet when they run `tailscale logout` (e.g. on VM shutdown).
                    type: boolean
                type: object
            required:
            - join
            - tailscale
            type: object
          status:
            description: NodeClassStatus defines the observed state of NodeClass
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
