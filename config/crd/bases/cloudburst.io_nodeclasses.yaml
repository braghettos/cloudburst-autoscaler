                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  applicationSecretSecretRef:
                    description: ApplicationSecretSecretRef references a secret containing
