                    type: string
                  region:
                    description: Region is the AWS region (optional when region comes
                      from CloudBroker recommendation; used as fallback)
                    type: string
                  secretAccessKeySecretRef:
                    description: SecretAccessKeySecretRef references a secret containing
                      the AWS secret access key.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        description: |-
                          Name of the referent.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
